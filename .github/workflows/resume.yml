name: ▶️ RESUME — חידוש מסחר

on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: idan-engine
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Clear halt flag
        run: |
          python3 -c "import json; json.dump({'halt': False, 'close_all': False}, open('data/control.json','w'))"
      - name: Commit
        run: |
          git config user.name "idan-signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/control.json
          git commit -m "▶️ trading resumed" || echo none
          git pull --rebase --autostash origin main || true
          git push
