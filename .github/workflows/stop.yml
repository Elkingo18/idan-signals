name: 🛑 STOP — מפסק חירום

on:
  workflow_dispatch:
    inputs:
      close_all:
        description: 'גם לסגור את כל הפוזיציות הפתוחות עכשיו? (true/false)'
        required: true
        default: 'false'

permissions:
  contents: write

concurrency:
  group: idan-engine
  cancel-in-progress: false

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Set halt flag
        run: |
          python -c "import json; json.dump({'halt': True, 'close_all': '${{ inputs.close_all }}'=='true'}, open('data/control.json','w'))"
      - name: Install deps
        run: pip install --quiet -r requirements.txt
      - name: Apply immediately (engine tick)
        run: python engine/engine.py
      - name: Commit
        run: |
          git config user.name "idan-signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "🛑 EMERGENCY STOP (close_all=${{ inputs.close_all }})" || echo none
          git pull --rebase --autostash origin main || true
          git push
