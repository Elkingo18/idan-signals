name: Idan Signals — scheduler B (cron fix)

# Duplicate of trade.yml with fresh file name + offset minutes.
# Reason: GitHub's scheduler never registered trade.yml's crons (0 scheduled runs).
# A brand-new workflow file forces a fresh schedule registration.
# Both files share the same concurrency group, so they can never run at the same time.

on:
  schedule:
    - cron: '7,37 6-20 * * 1-5'   # every 30 min, Europe open -> US close
    - cron: '23 21 * * 1-5'       # after the US close: settle the day
    - cron: '29 1-5 * * 1-5'      # hourly overnight (Asia Globex) for gold
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idan-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install --quiet -r requirements.txt

      - name: Self-test (never trade with broken logic)
        run: python engine/selftest.py

      - name: Run the engine
        run: python engine/engine.py

      - name: Commit new state
        run: |
          # data/ is a generated snapshot, not a document. It must never be
          # merged: the newest engine tick is always the truth.
          #
          # The old version ran "git pull --rebase --autostash origin main || true"
          # and then "git push". On a content conflict in data/state.json the
          # rebase stopped, the "|| true" swallowed the failure, the repo was
          # left on a DETACHED HEAD, and the push died with exit code 128.
          #
          # That is precisely what happened on 4.8.2026 at 15:31: the engine
          # stopped publishing for two hours while the local bridge kept
          # reconciling a frozen file and reporting "book: flat" every sixty
          # seconds - a perfect health report on a paralysed system.
          #
          # Re-parenting onto origin/main with "reset --soft" keeps the freshly
          # generated files and turns the push into a plain fast-forward.
          # No merge, no conflict, last writer wins - the correct semantic for
          # a regenerated snapshot.
          set -e
          git config user.name  "idan-signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main
            git add data/
            if git diff --staged --quiet; then
              echo "remote already carries this state"
              exit 0
            fi
            git commit -m "engine tick $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected - another run got there first, retrying"
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "could not push after 5 attempts"
          exit 1
