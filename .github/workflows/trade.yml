name: Idan Signals — auto paper trading

on:
  schedule:
    # ---- times are UTC. Israel = UTC+3 (summer) / +2 (winter). US market = 13:30-20:00 UTC ----
    # off-peak minutes on purpose: GitHub DROPS schedules on busy marks like :00/:30
    - cron: '13,43 6-20 * * 1-5'   # every 30 min, Europe open -> US close (gold rides all day)
    - cron: '11 21 * * 1-5'        # after the US close: settle the day, build the day-card
    - cron: '17 1-5 * * 1-5'       # hourly overnight (Asia Globex) for gold
  workflow_dispatch:                # "Run workflow" button — use this to test

permissions:
  contents: write                   # lets the run commit data/state.json back. No PAT needed.

concurrency:
  group: idan-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install --quiet -r requirements.txt

      - name: Self-test (never trade with broken logic)
        run: python engine/selftest.py

      - name: Run the engine
        run: python engine/engine.py

      - name: Commit new state
        run: |
          # Same fix as auto.yml, and for the same reason: these two workflows
          # both regenerate data/ and both push. When one lands while the other
          # is mid-run, "git pull --rebase" hits a content conflict in
          # data/state.json, the old "|| true" hid the failure, the repo ended
          # up on a DETACHED HEAD and the push died with exit code 128.
          #
          # data/ is a generated snapshot, never a document: it must not be
          # merged, the newest tick is simply the truth. Re-parenting onto
          # origin/main keeps our fresh files and makes the push a plain
          # fast-forward.
          set -e
          git config user.name  "idan-signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main
            git add data/
            if git diff --staged --quiet; then
              echo "remote already carries this state"
              exit 0
            fi
            git commit -m "engine tick $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected - another run got there first, retrying"
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "could not push after 5 attempts"
          exit 1
